<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Kachra Satya</title>
  <desc id="d">Every waste promise deserves a receipt. A bin whose ribs are tally marks, beside two official figures that do not agree: 81 percent and 61.6 percent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1F17"/>
      <stop offset="1" stop-color="#12382A"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#BFE84F" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- the icon: a bin whose ribs are tally marks, one slash across them -->
  <g transform="translate(88 70) scale(5.2)">
    <rect width="32" height="32" rx="8" fill="#0E2A20" stroke="#BFE84F" stroke-opacity=".35" stroke-width=".6"/>
    <path d="M8.5 10.5h15M13 10.5V8.2h6v2.3" fill="none" stroke="#BFE84F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 13.6v9.6M14.7 13.6v9.6M17.3 13.6v9.6M20 13.6v9.6" fill="none" stroke="#BFE84F" stroke-width="1.9" stroke-linecap="round"/>
    <path d="M9.4 22.4l13.2-7.6" fill="none" stroke="#E4795B" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- the name and the idea -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="300" y="132" font-size="84" font-weight="800" fill="#F4F1E6" letter-spacing="-2">Kachra Satya</text>
    <text x="304" y="184" font-size="30" font-weight="500" fill="#BFE84F">Every waste promise deserves a receipt.</text>
    <text x="304" y="228" font-size="19" fill="#B9C9BF">Check India's official waste figures against each other,</text>
    <text x="304" y="254" font-size="19" fill="#B9C9BF">and give a resident a record that gets heard.</text>
  </g>

  <!-- two official figures that disagree -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <g transform="translate(960 78)">
      <rect width="250" height="76" rx="14" fill="#0E2A20" stroke="#BFE84F" stroke-opacity=".4"/>
      <text x="20" y="34" font-size="13" fill="#B9C9BF" letter-spacing="1.4">MOHUA  2025-26</text>
      <text x="20" y="64" font-size="30" font-weight="800" fill="#F4F1E6">81% processed</text>
    </g>
    <g transform="translate(960 170)">
      <rect width="250" height="76" rx="14" fill="#0E2A20" stroke="#E4795B" stroke-opacity=".6"/>
      <text x="20" y="34" font-size="13" fill="#B9C9BF" letter-spacing="1.4">CPCB  2023-24</text>
      <text x="20" y="64" font-size="30" font-weight="800" fill="#F4F1E6">61.6% treated</text>
    </g>
    <text x="1085" y="158" font-size="22" font-weight="800" fill="#E4795B" text-anchor="middle">≠</text>
  </g>
</svg>
